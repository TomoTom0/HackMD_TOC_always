<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>HackMD TOC always - Options</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
        }
        .option-group {
            margin-bottom: 20px;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        .option-group h5 {
            margin-top: 0;
            margin-bottom: 10px;
        }
        button {
            padding: 5px 15px;
            margin-right: 5px;
            cursor: pointer;
        }
        .value-display {
            display: inline-block;
            min-width: 50px;
            text-align: center;
            font-weight: bold;
        }
        #status {
            margin-top: 10px;
            padding: 10px;
            border-radius: 3px;
            display: none;
        }
        #status.success {
            background-color: #d4edda;
            color: #155724;
        }
    </style>
</head>
<body>
    <h1>HackMD TOC always - Options</h1>

    <div class="option-group">
        <h5>Opacity</h5>
        <button type="button" id="btnOpacityPlus">+</button>
        <button type="button" id="btnOpacityMinus">-</button>
        <span id="opacityValue" class="value-display">0.5</span>
    </div>

    <div class="option-group">
        <h5>Width</h5>
        <button type="button" id="btnWidthPlus">+</button>
        <button type="button" id="btnWidthMinus">-</button>
        <span id="widthValue" class="value-display">150</span>
    </div>

    <div class="option-group">
        <h5>TOC Visibility</h5>
        <button type="button" id="btnToggleHidden">Toggle</button>
        <span id="hiddenValue" class="value-display">Visible</span>
    </div>

    <div class="option-group">
        <h5>Expand TOC</h5>
        <button type="button" id="btnToggleExpand">Toggle</button>
        <span id="expandValue" class="value-display">Expanded</span>
    </div>

    <div id="status"></div>

    <script src="options_script.js"></script>
</body>
</html>
